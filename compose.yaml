services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: coffee_t
      POSTGRES_USER: coffee_t
      POSTGRES_PASSWORD: coffee-t-local-only
    ports:
      - "5432:5432"
    volumes:
      - coffee_t_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coffee_t -d coffee_t"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://coffee_t:coffee-t-local-only@postgres:5432/coffee_t
      FRONTEND_ORIGIN: http://localhost:3000
      JWT_ACCESS_SECRET: local-only-access-secret-change-before-any-shared-use
      JWT_ISSUER: coffee-t-api
      JWT_AUDIENCE: coffee-t-store
      CSRF_SECRET: local-only-csrf-secret-change-before-any-shared-use
      BOOKING_DURATION_MINUTES: 90
      BOOKING_SLOT_MINUTES: 30
      BOOKING_ADVANCE_DAYS: 30
      BOOKING_CANCELLATION_CUTOFF_MINUTES: 120
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  coffee_t_postgres: